name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_voucher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e_voucher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/e_voucher_test
      JWT_SECRET: ci-only-partner-backend-secret
      JWT_EXPIRES_IN: 5m
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Initialize test database
        working-directory: ./backend
        run: npm run db:init

      - name: Typecheck and test
        working-directory: ./backend
        run: |
          npm run typecheck
          npm test

      - name: Compile backend
        working-directory: ./backend
        run: npm exec tsc

      - name: Package release
        working-directory: ./backend
        run: |
          mkdir -p deploy-backend
          cp -a dist package.json package-lock.json deploy-backend/
          tar -czf backend-release.tar.gz -C deploy-backend .

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend/backend-release.tar.gz
          target: /tmp/
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            SERVICE="webapp-backend"
            REMOTE_DIR="/srv/webapp/backend"
            REMOTE_ARCHIVE="/tmp/backend-release.tar.gz"
            ENV_FILE="/etc/webapp/backend.env"

            sudo install -d -o webapp -g webapp "$REMOTE_DIR"

            echo "Checking backend environment file..."
            sudo test -f "$ENV_FILE"
            sudo -u webapp test -r "$ENV_FILE"

            echo "Stopping backend service..."
            sudo systemctl stop "$SERVICE"

            echo "Replacing backend release..."
            sudo find "$REMOTE_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            sudo tar -xzf "$REMOTE_ARCHIVE" -C "$REMOTE_DIR"
            sudo chown -R webapp:webapp "$REMOTE_DIR"

            echo "Installing production dependencies..."
            cd "$REMOTE_DIR"
            sudo -u webapp npm ci --omit=dev

            echo "Starting backend service..."
            sudo systemctl start "$SERVICE"

            echo "Waiting for backend health check..."
            healthy=false
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              sudo systemctl status "$SERVICE" --no-pager || true
              sudo journalctl -u "$SERVICE" -n 100 --no-pager || true
              exit 1
            fi

            sudo systemctl is-active --quiet "$SERVICE"
            rm -f "$REMOTE_ARCHIVE"
            echo "Backend deployment completed successfully."
